name: Daily Report Cron

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  # Allows triggering manually from the Actions tab
  workflow_dispatch:

jobs:
  trigger-report:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Daily Report Endpoint
        run: |
          echo "Pinging Cloudflare Pages function..."
          curl -X POST https://elatlantedesancristobal.com/test-report
          echo "Done."
