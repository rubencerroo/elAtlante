<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
      <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1e3a8a" />
    <title>El Atlante de San Cristóbal</title>
    <meta name="description" content="Tradición pesquera y producto Km 0 en un entorno inigualable frente al Atlántico. ¡Reserva tu mesa!" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://elatlantedesancristobal.com" />
    <meta property="og:title" content="El Atlante de San Cristóbal" />
    <meta property="og:description" content="Tradición pesquera y producto Km 0 en un entorno inigualable frente al Atlántico. ¡Reserva tu mesa!" />
    <meta property="og:image" content="https://elatlantedesancristobal.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://elatlantedesancristobal.com" />
    <meta property="twitter:title" content="El Atlante de San Cristóbal" />
    <meta property="twitter:description" content="Tradición pesquera y producto Km 0 en un entorno inigualable frente al Atlántico. ¡Reserva tu mesa!" />
    <meta property="twitter:image" content="https://elatlantedesancristobal.com/og-image.jpg" />

  </head>
  <body>
    <script>
      const theme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (theme === 'dark' || (!theme && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        if (!localStorage.getItem('theme')) {
          document.documentElement.classList.toggle('dark', e.matches);
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
